<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTO FIT | Made to Overcome.</title>
  <meta name="description" content="Practical fitness, nutrition, and coaching for real life. Join In Your Corner Fit Club free on Skool."/>
  <meta name="theme-color" content="#08160F"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet"/>

  <script>
  /* ============================================================
     EDIT ZONE: Make all your changes here, nowhere else
     ============================================================ */

  /* IMAGES (must match filenames in your web root exactly) */
  var HERO_IMAGE      = "hero-bg.jpg";
  var LOGO_IMAGE      = "logo_white_new.png";

  /* SKOOL LINK (every button on the page uses this) */
  var SKOOL_LINK      = "https://www.skool.com/coachtonyo/about";

  /* NAV */
  var NAV_CTA_TEXT    = "Join Free";

  /* HERO */
  var HERO_EYEBROW    = "In Your Corner Fit Club · Free Community";
  var HERO_LINE1      = "Win Through";
  var HERO_LINE2      = "The Chaos.";
  var HERO_SUBTEXT    = "You don't need a perfect schedule or a fancy gym. Simple training, practical nutrition, a stronger mindset, and a coach in your corner when life gets messy.";
  var HERO_CTA_TEXT   = "Join the Club Free";
  var HERO_CTA_NOTE   = "Free to join on Skool. From a coach with 20 years in the game.";

  /* QUICK PROOF POINTS (under the button) */
  var POINT1          = "Free Workouts";
  var POINT2          = "Nutrition Guidance";
  var POINT3          = "Mindset Training";

  /* META PIXEL (leave "" to turn off) */
  var META_PIXEL_ID   = "1930317005037660";

  /* ============================================================
     STOP EDITING: Do not change anything below this line
     ============================================================ */
  </script>

  <style>
    :root{
      --gold:#E8B04B;
      --gold-light:#F6CF7A;
      --gold-deep:#C9862A;
      --forest:#10281F;
      --forest-deep:#08160F;
      --cream:#F3EAD8;
      --ink:#0B0B0B;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{overflow-x:hidden;max-width:100%;}
    body{background:var(--forest-deep);color:var(--cream);font-family:'Sora',sans-serif;font-size:16px;line-height:1.7;}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:200;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:rgba(8,22,15,0.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(232,176,75,0.15);}
    .nav-logo img{height:38px;width:auto;display:block;}
    .nav-cta{background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));color:var(--ink);font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;padding:11px 26px;border-radius:4px;text-decoration:none;transition:opacity 0.2s;}
    .nav-cta:hover{opacity:0.88;}

    /* HERO */
    .hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
    .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;}
    .hero-overlay{position:absolute;inset:0;background:rgba(8,22,15,0.62);z-index:1;}
    .hero-overlay2{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,22,15,0.9) 0%,transparent 60%);z-index:1;}
    .hero-content{position:relative;z-index:2;padding:150px 48px 110px;max-width:900px;width:100%;}

    .hero-eyebrow{font-size:13px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:12px;}
    .hero-eyebrow::before,.hero-eyebrow::after{content:'';flex:0 0 36px;height:1px;background:var(--gold);opacity:0.7;}

    .hero-h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:104px;line-height:0.95;text-transform:uppercase;letter-spacing:0.01em;margin-bottom:28px;color:var(--cream);}
    .hero-h1 .accent{display:block;color:var(--gold);background:linear-gradient(180deg,var(--gold-light) 0%,var(--gold) 55%,var(--gold-deep) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

    .hero-sub{font-size:20px;color:rgba(243,234,216,0.82);line-height:1.65;max-width:620px;margin:0 auto 40px;}

    .btn-primary{display:inline-block;background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));color:var(--ink);font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.14em;text-transform:uppercase;padding:20px 52px;border-radius:4px;text-decoration:none;transition:opacity 0.2s,transform 0.15s;animation:pulse-neon 2.5s ease-in-out infinite;}
    .btn-primary:hover{opacity:0.92;transform:translateY(-2px);animation:none;box-shadow:0 0 32px rgba(232,176,75,0.65);}
    @keyframes pulse-neon{0%,100%{box-shadow:0 0 0 0 rgba(232,176,75,0);}50%{box-shadow:0 0 24px 6px rgba(232,176,75,0.38);}}

    .cta-note{font-size:14px;color:rgba(243,234,216,0.55);margin-top:16px;letter-spacing:0.04em;}

    .hero-points{margin-top:56px;display:flex;justify-content:center;flex-wrap:wrap;gap:16px 40px;list-style:none;}
    .hero-points li{display:flex;align-items:center;gap:10px;font-family:'Oswald',sans-serif;font-weight:500;font-size:16px;letter-spacing:0.1em;text-transform:uppercase;color:var(--cream);}
    .hero-points svg{width:20px;height:20px;flex-shrink:0;}

    /* MINI FOOTER */
    .mini-footer{background:var(--forest);border-top:1px solid rgba(232,176,75,0.15);padding:24px 48px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;color:rgba(243,234,216,0.4);}
    .mini-footer a{color:rgba(243,234,216,0.55);text-decoration:none;transition:color 0.2s;}
    .mini-footer a:hover{color:var(--gold);}
    .mini-footer .links{display:flex;gap:20px;flex-wrap:wrap;}
    .mini-footer .tagline{font-family:'Oswald',sans-serif;letter-spacing:0.18em;text-transform:uppercase;font-size:12px;}

    /* ENTRANCE ANIMATION */
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    .hero-eyebrow{animation:fadeUp 0.7s 0.1s ease both;}
    .hero-h1{animation:fadeUp 0.7s 0.2s ease both;}
    .hero-sub{animation:fadeUp 0.7s 0.3s ease both;}
    .hero-cta-wrap{animation:fadeUp 0.7s 0.4s ease both;}
    .hero-points{animation:fadeUp 0.7s 0.5s ease both;}

    /* RESPONSIVE */
    @media(max-width:900px){
      nav{padding:0 20px;height:64px;}
      .nav-logo img{height:32px;}
      .nav-cta{font-size:13px;padding:10px 18px;}
      .hero-content{padding:120px 24px 80px;}
      .hero-h1{font-size:64px;}
      .hero-sub{font-size:18px;}
      .hero-points{flex-direction:column;align-items:center;gap:14px;margin-top:44px;}
      .mini-footer{padding:24px 20px;flex-direction:column;align-items:flex-start;}
    }
    @media(max-width:480px){
      .hero-eyebrow{font-size:11px;letter-spacing:0.16em;}
      .hero-eyebrow::before,.hero-eyebrow::after{flex-basis:18px;}
      .hero-h1{font-size:48px;}
      .hero-sub{font-size:17px;}
      .btn-primary{display:block;width:100%;padding:20px 24px;font-size:17px;}
    }
    @media(prefers-reduced-motion:reduce){
      *{animation:none !important;transition:none !important;}
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo"><img id="logo-img" src="" alt="CTO FIT"/></a>
  <a id="nav-cta" href="#" class="nav-cta skool-link"></a>
</nav>

<section class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-overlay2"></div>
  <div class="hero-content">
    <div class="hero-eyebrow" id="hero-eyebrow"></div>
    <h1 class="hero-h1" id="hero-h1"></h1>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-cta-wrap">
      <a id="hero-cta" href="#" class="btn-primary skool-link"></a>
      <p class="cta-note" id="cta-note"></p>
    </div>
    <ul class="hero-points">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg><span id="p1"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg><span id="p2"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg><span id="p3"></span></li>
    </ul>
  </div>
</section>

<footer class="mini-footer">
  <span>© 2026 CTO Health LLC. All rights reserved.</span>
  <div class="links">
    <a href="legal.html">Terms</a>
    <a href="legal.html#privacy">Privacy</a>
    <a href="legal.html#disclaimer">Disclaimer</a>
    <a href="mailto:support@ctofit.com">Support</a>
  </div>
  <span class="tagline">Made to Overcome.</span>
</footer>

<script>
  // Wire Edit Zone to the page
  document.getElementById('hero-bg').style.backgroundImage = "url('" + HERO_IMAGE + "')";
  document.getElementById('logo-img').src = LOGO_IMAGE;
  document.getElementById('nav-cta').textContent = NAV_CTA_TEXT;
  document.getElementById('hero-eyebrow').textContent = HERO_EYEBROW;
  document.getElementById('hero-h1').innerHTML = HERO_LINE1 + '<span class="accent">' + HERO_LINE2 + '</span>';
  document.getElementById('hero-sub').textContent = HERO_SUBTEXT;
  document.getElementById('hero-cta').textContent = HERO_CTA_TEXT;
  document.getElementById('cta-note').textContent = HERO_CTA_NOTE;
  document.getElementById('p1').textContent = POINT1;
  document.getElementById('p2').textContent = POINT2;
  document.getElementById('p3').textContent = POINT3;

  // Every Skool button gets the same link
  document.querySelectorAll('.skool-link').forEach(function(a){
    a.href = SKOOL_LINK;
    a.addEventListener('click', function(){
      if (window.fbq) fbq('trackCustom', 'SkoolClick', {location: a.id});
    });
  });

  // Meta Pixel (PageView)
  if (META_PIXEL_ID) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', META_PIXEL_ID);
    fbq('track', 'PageView');
  }
</script>
</body>
</html>
